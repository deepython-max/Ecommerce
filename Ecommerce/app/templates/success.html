    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payment Successful</title>

        <style>
            body{
                font-family: Arial, sans-serif;
                background:#f4f4f4;
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
            }

            .success-box{
                background:#fff;
                padding:40px;
                border-radius:10px;
                text-align:center;
                box-shadow:0 0 15px rgba(0,0,0,0.1);
            }

            .success-icon{
                font-size:70px;
                color:green;
            }

            h2{
                color:#333;
            }

            p{
                color:#666;
            }

            .btn{
                display:inline-block;
                margin-top:20px;
                padding:10px 20px;
                background:#28a745;
                color:white;
                text-decoration:none;
                border-radius:5px;
            }

            .btn:hover{
                background:#218838;
            }
        </style>
    </head>
    <body>

        <div class="success-box">
            <div class="success-icon">✔</div>

            <h2>Payment Successful!</h2>

            <p>Your order has been placed successfully.</p>

            <p>Thank you for shopping with GreatKart.</p>

            <a href="{% url 'home' %}" class="btn">
                Continue Shopping
            </a>
        </div>

    </body>
    </html>
